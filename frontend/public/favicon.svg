<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- ClassSquare Rounded Square Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#cs-grad)" />
  <rect x="3" y="3" width="58" height="58" rx="16" stroke="url(#cs-border)" stroke-width="2.5" fill="none" />

  <!-- Bold Vector Letter C with Rounded Caps (No font dependency) -->
  <path
    d="M 44 20 A 16.5 16.5 0 1 0 44 44"
    fill="none"
    stroke="#ffffff"
    stroke-width="8.5"
    stroke-linecap="round"
  />
</svg>
