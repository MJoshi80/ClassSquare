version: "3.8"

services:
  backend:
    build: ./backend
    container_name: classsquare-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-classsquare-production-secret-key-change-me}
      - DATABASE_URL=sqlite:///./data/classsquare.db
      - ACCESS_TOKEN_EXPIRE_HOURS=8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: classsquare-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
